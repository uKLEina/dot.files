# 新規ペインをログインシェルで起動（.zprofileが読まれるように）
set -g default-command "${SHELL} -l"

# prefixキーをC-sに変更する
set -g prefix C-s

# C-bのキーバインドを解除する
unbind C-b

# キーストロークのディレイを減らす
set -sg escape-time 0

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-t*2でtmux内のプログラムにC-tを送る
bind C-t send-prefix

# | でペインを縦に分割する
bind | split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する
bind - split-window -v -c "#{pane_current_path}"

# 新規ウィンドウでもカレントディレクトリを引き継ぐ
# bind c new-window -c "#{pane_current_path}"

# マウス操作を有効にする
#set -g mouse on

# ターミナル機能
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:strikethrough:usstyle:hyperlinks:overline"
# noctty (Ghostty系) 用。TERM=xterm-ghostty なので上の xterm-256color 行は
# マッチせず、指定しないと truecolor もハイパーリンクも失われる。
# 同梱 terminfo の Tc/Ms/Ss/Su/smxx/Smulx/hs から裏取りした機能のみ列挙。
# sixel は noctty が Kitty graphics 側なので含めない。
set -as terminal-features ",xterm-ghostty:RGB:strikethrough:usstyle:hyperlinks:overline:clipboard:cstyle:ccolour:extkeys:focus:sync:title"

# DCS パススルーを許可する。
# tmux 3.3 以降は既定 off で、.zshrc の vterm_printf が使う
# \ePtmux;... のラップも off のままでは破棄される。
set -g allow-passthrough on
set -g extended-keys on

# ステータスバーの色を設定する
set -g status-fg white
set -g status-bg black

# ウィンドウリストの色を設定する
setw -g window-status-style fg="cyan",bg="default","dim"
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg="black",bg="white","bright"

# ペインボーダーの色を設定する
set -g pane-border-style fg="green",bg="black"
# アクティブなペインを目立たせる
set -g pane-active-border-style fg="white",bg="yellow"

# コマンドラインの色を設定する
set -g message-style fg="white",bg="white",bright

# ステータスバーを設定する
## 左パネルを設定する
#set -g status-left-length 40
#set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
## 右パネルを設定する
set -g status-right "#[fg=cyan][%Y-%m-%d(%a) %H:%M]"
## リフレッシュの間隔を設定する(デフォルト 15秒)
# set -g status-interval 60
## ウィンドウリストの位置を中心寄せにする
# set -g status-justify centre
# ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity on
set -g visual-activity on
## ステータスバーを上部に表示する
#set -g status-position top

set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on

set -g mouse on

# ==== Shared clipboard
# unbind -T  copy-mode M-w
# unbind -T copy-mode C-w
# bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "xsel -bi"
# bind-key -T copy-mode C-w send -X copy-pipe-and-cancel "xsel -bi"
# bind-key C-y run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
set -g set-clipboard on

# ==== OSC 133 プロンプト間ジャンプ
# シェル統合が出すマークは tmux が消費するので noctty 側の
# jump_to_prompt は効かない。tmux 3.4+ の同等機能を使う。
# mode-keys は emacs なのでテーブルは copy-mode。
# M-Up/M-Down は既定で halfpage-up/down なので避け、空いている M-p/M-n を使う。
bind -T copy-mode M-p send -X previous-prompt
bind -T copy-mode M-n send -X next-prompt

# コピーモードに入りつつ直前のプロンプトへ飛ぶ
bind -N "直前のプロンプトへ" C-p copy-mode \; send -X previous-prompt
